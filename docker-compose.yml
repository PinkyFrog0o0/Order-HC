# 本地开发依赖：PostgreSQL + Redis + MinIO
#
# 启动：docker compose up -d
# 停止：docker compose down
# 重置数据（删库）：docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: haycargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: haycargo
      POSTGRES_PASSWORD: haycargo
      POSTGRES_DB: haycargo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haycargo -d haycargo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haycargo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: haycargo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: haycargo
      MINIO_ROOT_PASSWORD: haycargo
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 初始化：自动创建 bucket（仅首次启动生效）
  minio-init:
    image: minio/mc:latest
    container_name: haycargo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 haycargo haycargo &&
      mc mb --ignore-existing local/haycargo-files &&
      mc anonymous set download local/haycargo-files &&
      echo 'MinIO bucket haycargo-files ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: